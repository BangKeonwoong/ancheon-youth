<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안천 청소년부 커뮤니티</title>
<meta name="description" content="안천교회 청소년부 커뮤니티 — 게시판, 기도제목, 일정, 출석체크, 포인트">
<meta property="og:title" content="안천 청소년부 커뮤니티">
<meta property="og:description" content="안천교회 청소년부 친구들의 온라인 아지트">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== 로그인/가입 ===== */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 26px;width:100%;max-width:380px}
.auth-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:20px}
.auth-tabs{display:flex;gap:6px;margin-bottom:16px}
.auth-tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);font-weight:700;color:var(--sub);background:var(--card)}
.auth-tabs button.active{background:var(--primary);border-color:var(--primary);color:#fff}
.auth-card input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;outline:none;font-size:.95rem}
.auth-card input:focus{border-color:var(--primary)}
.auth-btn{width:100%;background:var(--primary);color:#fff;font-weight:800;padding:13px;border-radius:10px;font-size:1rem}
.auth-btn:disabled{opacity:.6}
.auth-err{color:var(--pastor);font-size:.85rem;margin-bottom:8px;min-height:1.1em}
.authing header,.authing .layout,.authing .mobile-nav{display:none}
.logout-btn{font-size:.72rem;color:var(--sub);padding:2px 5px;border-radius:6px;flex-shrink:0}
.logout-btn:hover{background:var(--bg);color:var(--pastor)}
</style>
<style>
:root{
  --primary:#E94F37;
  --primary-soft:#FDEEEB;
  --bg:#F7F7F8;
  --card:#FFFFFF;
  --line:#E4E4E7;
  --text:#222226;
  --sub:#8B8B93;
  --teacher:#2D6CDF;
  --pastor:#C0392B;
  --hot:#E94F37;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:1rem}
a{text-decoration:none;color:inherit}

/* ===== Header ===== */
header{
  position:sticky;top:0;z-index:50;background:var(--card);
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:1440px;margin:0 auto;padding:0 24px;height:60px;
  display:flex;align-items:center;gap:24px;
}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0}
.logo .mark{
  width:30px;height:30px;border-radius:8px;background:var(--primary);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;
}
.logo .name{font-weight:800;font-size:1.1rem}
.logo .name span{color:var(--primary)}
.gnb{display:flex;gap:4px;flex:1;min-width:0;overflow:hidden}
.gnb button{
  padding:7px 14px;border-radius:8px;font-size:.95rem;font-weight:600;color:var(--sub);
  white-space:nowrap;flex-shrink:0;
}
.gnb button:hover{background:var(--bg)}
.gnb button.active{color:var(--primary);background:var(--primary-soft)}
.search{
  display:flex;align-items:center;gap:6px;background:var(--bg);
  border-radius:8px;padding:8px 12px;flex:0 1 240px;min-width:110px;
}
.search input{border:none;background:none;outline:none;width:100%;font-size:.9rem}
.user-chip{
  display:flex;align-items:center;gap:8px;flex-shrink:0;cursor:pointer;
  padding:5px 10px;border-radius:20px;border:1px solid var(--line);
}
.avatar{
  width:30px;height:30px;border-radius:50%;background:var(--primary-soft);
  color:var(--primary);font-weight:700;font-size:10px;letter-spacing:-.5px;
  display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;
}
.user-chip .uname{font-weight:600;font-size:.9rem}

/* ===== Layout ===== */
.layout{
  max-width:1440px;margin:0 auto;padding:24px;
  display:grid;grid-template-columns:240px minmax(0,1fr) 330px;gap:24px;
  align-items:start;
}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}

/* ===== Left sidebar ===== */
.side-section{padding:8px;margin-bottom:12px}
.side-title{font-size:.8rem;font-weight:700;color:var(--sub);padding:8px 10px 4px}
.side-menu button{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:8px 10px;border-radius:8px;font-size:.95rem;font-weight:500;color:var(--text);
}
.side-menu button:hover{background:var(--bg)}
.side-menu button.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
.side-menu .cnt{margin-left:auto;font-size:.75rem;color:var(--sub)}
.write-btn{
  display:block;width:100%;padding:11px;border-radius:10px;margin-bottom:12px;
  background:var(--primary);color:#fff;font-weight:700;font-size:.98rem;text-align:center;
}
.write-btn:hover{filter:brightness(.95)}

/* ===== Right sidebar ===== */
.widget{padding:14px 16px;margin-bottom:12px}
.widget h3{font-size:.95rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.widget h3 .more{margin-left:auto;font-size:.78rem;color:var(--sub);font-weight:500;cursor:pointer}
.dday{
  background:linear-gradient(135deg,#E94F37,#F2784B);color:#fff;border:none;
}
.dday .dd-label{font-size:.82rem;opacity:.9}
.dday .dd-title{font-size:1.15rem;font-weight:800;margin:2px 0}
.dday .dd-count{font-size:1.7rem;font-weight:900}
.worship-row{display:flex;justify-content:space-between;padding:5px 0;font-size:.88rem}
.worship-row .k{color:var(--sub)}
.worship-row .v{font-weight:600}
.hot-item{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--bg);cursor:pointer;align-items:baseline}
.hot-item:last-child{border:none}
.hot-item .rank{font-weight:800;color:var(--primary);font-size:.85rem;width:14px;flex-shrink:0}
.hot-item .t{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hot-item .lk{margin-left:auto;font-size:.75rem;color:var(--primary);flex-shrink:0}
.att-mini{display:flex;gap:5px;margin-top:4px}
.att-dot{
  flex:1;min-height:44px;padding:5px 0;border-radius:8px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--sub);
  flex-direction:column;gap:1px;overflow:hidden;
}
.att-dot.on{background:var(--primary-soft);color:var(--primary);font-weight:700}

/* ===== Hero (홈 상단 이미지 배너) ===== */
.hero{
  position:relative;height:240px;border-radius:16px;overflow:hidden;
  margin-bottom:12px;cursor:pointer;border:1px solid var(--line);
}
.hero-slide{
  position:absolute;inset:0;opacity:0;transition:opacity .6s ease;
  display:flex;align-items:flex-end;background-size:cover;background-position:center;
  pointer-events:none;
}
.hero-slide.on{opacity:1;pointer-events:auto}
.hero-slide .hs-emoji{
  position:absolute;right:48px;top:44%;transform:translateY(-50%);
  font-size:6.5rem;opacity:.4;text-shadow:0 6px 24px rgba(0,0,0,.2);
}
.hero-slide .hs-body{
  position:relative;padding:24px 28px;color:#fff;width:100%;
  background:linear-gradient(transparent,rgba(0,0,0,.5));
}
.hs-tag{
  display:inline-block;background:rgba(255,255,255,.28);
  font-size:.68rem;font-weight:800;letter-spacing:1.5px;
  padding:3px 10px;border-radius:12px;margin-bottom:7px;
}
.hs-title{font-size:1.65rem;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.3);line-height:1.25}
.hs-sub{font-size:.92rem;opacity:.95;margin-top:3px;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.hero-nav{position:absolute;bottom:16px;right:18px;display:flex;gap:6px;z-index:5;align-items:center}
.hero-dot{
  width:8px;height:8px;border-radius:5px;background:rgba(255,255,255,.5);
  cursor:pointer;transition:all .25s;
}
.hero-dot.on{background:#fff;width:22px}
.hero-arrow{
  position:absolute;top:50%;transform:translateY(-50%);z-index:5;
  width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.28);color:#fff;
  font-size:1.05rem;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;
}
.hero:hover .hero-arrow{opacity:1}
.hero-arrow:hover{background:rgba(0,0,0,.45)}
.hero-arrow.l{left:14px}
.hero-arrow.r{right:14px}
@media(max-width:720px){
  .hero{height:175px;border-radius:14px}
  .hs-title{font-size:1.25rem}
  .hs-sub{font-size:.82rem}
  .hero-slide .hs-emoji{font-size:4rem;right:20px}
  .hero-slide .hs-body{padding:16px 18px}
}

/* ===== Home ===== */
.notice-banner{
  display:flex;align-items:center;gap:10px;padding:12px 16px;margin-bottom:12px;
  background:var(--primary-soft);border:1px solid #F5CFC7;border-radius:12px;cursor:pointer;
}
.notice-banner .tag{
  background:var(--primary);color:#fff;font-size:.72rem;font-weight:700;
  padding:3px 8px;border-radius:6px;flex-shrink:0;
}
.notice-banner .txt{font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-count{margin-left:auto;font-size:.72rem;color:var(--sub);flex-shrink:0;font-weight:600}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.board-preview{padding:14px 16px}
.board-preview h3{
  font-size:.98rem;font-weight:700;margin-bottom:8px;cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.board-preview h3:hover{color:var(--primary)}
.board-preview h3 .arr{margin-left:auto;color:var(--sub);font-size:.8rem;font-weight:400}
.bp-item{
  display:flex;gap:8px;padding:6px 0;font-size:.88rem;cursor:pointer;
  border-bottom:1px solid var(--bg);align-items:baseline;
}
.bp-item:last-child{border:none}
.bp-item:hover .t{color:var(--primary)}
.bp-item .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp-item .meta{margin-left:auto;flex-shrink:0;font-size:.75rem;color:var(--sub)}
.bp-item .c{color:var(--primary);font-size:.78rem;font-weight:600;flex-shrink:0}

/* ===== Board list (인벤식) ===== */
.board-head{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.board-head .desc{min-width:0}
.board-head h2{font-size:1.15rem;font-weight:800}
.board-head .desc{color:var(--sub);font-size:.85rem}
.board-head .bh-write{
  margin-left:auto;background:var(--primary);color:#fff;font-weight:700;
  padding:8px 14px;border-radius:8px;font-size:.88rem;
}
.post-row{
  display:flex;align-items:center;gap:10px;padding:11px 16px;
  border-bottom:1px solid var(--bg);cursor:pointer;
}
.post-row:hover{background:#FCFCFD}
.post-row .num{width:36px;text-align:center;color:var(--sub);font-size:.8rem;flex-shrink:0}
.post-row .num.notice-tag{color:var(--primary);font-weight:700}
.post-row .title-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.post-row .title{
  font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.post-row:hover .title{color:var(--primary)}
.post-row .cmt{color:var(--primary);font-size:.8rem;font-weight:700;flex-shrink:0}
.post-row .author{width:130px;font-size:.82rem;color:#555;flex-shrink:0;display:flex;align-items:center;gap:3px;overflow:hidden;white-space:nowrap}
.post-row .time{width:50px;font-size:.78rem;color:var(--sub);text-align:center;flex-shrink:0}
.post-row .views,.post-row .likes{width:44px;font-size:.78rem;color:var(--sub);text-align:center;flex-shrink:0}
.post-row .likes{color:var(--primary)}
.list-cols{
  display:flex;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);
  font-size:.75rem;color:var(--sub);background:#FAFAFB;
}
.list-cols .c-num{width:36px;text-align:center}
.list-cols .c-title{flex:1}
.list-cols .c-author{width:130px}
.list-cols .c-time{width:50px;text-align:center}
.list-cols .c-views,.list-cols .c-likes{width:44px;text-align:center}
.badge{
  font-size:.66rem;font-weight:700;padding:1px 5px;border-radius:4px;flex-shrink:0;
}
.badge.teacher{background:#EAF1FD;color:var(--teacher)}
.badge.pastor{background:#FBEAE8;color:var(--pastor)}
.badge.hot-badge{background:var(--primary);color:#fff}
.badge.origin{background:#F0F0F3;color:#555}

/* ===== Post detail ===== */
.post-detail{padding:20px}
.pd-board{font-size:.82rem;color:var(--primary);font-weight:700;cursor:pointer;margin-bottom:6px;display:inline-block}
.pd-title{font-size:1.3rem;font-weight:800;margin-bottom:10px}
.pd-meta{display:flex;align-items:center;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--sub)}
.pd-meta .author{color:var(--text);font-weight:600;display:flex;align-items:center;gap:4px}
.pd-body{padding:18px 0;font-size:.98rem;white-space:pre-line;min-height:80px}
.pd-actions{display:flex;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.act-btn{
  display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;
  border:1px solid var(--line);font-size:.88rem;font-weight:600;color:#555;background:var(--card);
}
.act-btn:hover{border-color:var(--primary);color:var(--primary)}
.act-btn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.cmt-count{font-weight:700;padding:14px 0 6px;font-size:.95rem}
.cmt-count span{color:var(--primary)}
.comment{padding:11px 0;border-bottom:1px solid var(--bg)}
.comment .ch{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.comment .ca{font-weight:700;font-size:.88rem;display:flex;align-items:center;gap:4px}
.comment .ct{font-size:.75rem;color:var(--sub)}
.comment .cb{font-size:.92rem}
.comment.reply{margin-left:24px;background:#FAFAFB;padding:10px 12px;border-radius:8px;border:none;margin-bottom:6px}
.cmt-form{display:flex;gap:8px;margin-top:12px}
.cmt-form input{
  flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;font-size:.92rem;
}
.cmt-form input:focus{border-color:var(--primary)}
.cmt-form button{
  background:var(--primary);color:#fff;font-weight:700;padding:0 18px;border-radius:8px;font-size:.9rem;
}
.back-link{font-size:.85rem;color:var(--sub);margin-bottom:10px;cursor:pointer;display:inline-block}
.back-link:hover{color:var(--primary)}

/* ===== Write ===== */
.write-form{padding:20px;display:flex;flex-direction:column;gap:12px}
.write-form select,.write-form input,.write-form textarea{
  border:1px solid var(--line);border-radius:8px;padding:11px 12px;outline:none;
}
.write-form select:focus,.write-form input:focus,.write-form textarea:focus{border-color:var(--primary)}
.write-form textarea{min-height:220px;resize:vertical;line-height:1.6}
.write-submit{
  background:var(--primary);color:#fff;font-weight:700;padding:12px;border-radius:8px;font-size:1rem;
}

/* ===== Prayer ===== */
.prayer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.prayer-card{padding:16px;display:flex;flex-direction:column;gap:8px}
.prayer-card .ph{display:flex;align-items:center;gap:8px}
.prayer-card .pa{font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:4px}
.prayer-card .pt{font-size:.75rem;color:var(--sub);margin-left:auto}
.prayer-card .pb{font-size:.93rem;flex:1}
.pray-btn{
  align-self:flex-start;display:flex;align-items:center;gap:6px;
  border:1px solid var(--line);border-radius:20px;padding:6px 14px;
  font-size:.85rem;font-weight:600;color:#555;background:var(--card);
}
.pray-btn:hover{border-color:var(--primary);color:var(--primary)}
.pray-btn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.prayer-form{padding:16px;display:flex;gap:8px;margin-bottom:12px}
.prayer-form input{
  flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;font-size:.92rem;
}
.prayer-form input:focus{border-color:var(--primary)}
.prayer-form button{background:var(--primary);color:#fff;font-weight:700;padding:0 16px;border-radius:8px}

/* ===== Calendar ===== */
.cal-head{display:flex;align-items:center;justify-content:center;gap:16px;padding:16px}
.cal-head h2{font-size:1.1rem;font-weight:800}
.cal-head button{font-size:1.1rem;color:var(--sub);padding:4px 10px;border-radius:8px}
.cal-head button:hover{background:var(--bg)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line)}
.cal-dow{padding:8px;text-align:center;font-size:.78rem;color:var(--sub);font-weight:600;border-bottom:1px solid var(--line)}
.cal-dow:first-child{color:var(--primary)}
.cal-cell{
  min-height:74px;padding:6px;border-bottom:1px solid var(--bg);border-right:1px solid var(--bg);
  font-size:.8rem;
}
.cal-cell:nth-child(7n+1) .d{color:var(--primary)}
.cal-cell .d{font-weight:600;color:#555}
.cal-cell.today .d{
  background:var(--primary);color:#fff;border-radius:50%;
  width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;
}
.cal-ev{
  margin-top:3px;background:var(--primary-soft);color:var(--primary);
  font-size:.68rem;font-weight:600;padding:2px 5px;border-radius:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.event-list{padding:14px 16px}
.event-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--bg);align-items:center}
.event-item:last-child{border:none}
.event-item .ed{
  background:var(--bg);border-radius:8px;padding:6px 10px;text-align:center;flex-shrink:0;min-width:54px;
}
.event-item .ed .m{font-size:.68rem;color:var(--sub)}
.event-item .ed .dd{font-weight:800;font-size:1.05rem;color:var(--primary)}
.event-item .et{font-weight:600;font-size:.92rem}
.event-item .es{font-size:.78rem;color:var(--sub)}

/* ===== Attendance ===== */
.att-hero{padding:22px;text-align:center}
.att-hero .streak{font-size:1.5rem;font-weight:900;color:var(--primary)}
.att-hero p{color:var(--sub);font-size:.88rem;margin-top:4px}
.att-check-btn{
  margin-top:14px;background:var(--primary);color:#fff;font-weight:800;
  padding:13px 40px;border-radius:30px;font-size:1.05rem;
}
.att-check-btn:disabled{background:#ccc;cursor:default}
.att-weeks{padding:16px}
.att-week-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bg)}
.att-week-row:last-child{border:none}
.att-week-row .w{font-size:.88rem;font-weight:600;flex:1}
.att-week-row .s{font-size:.8rem;color:var(--sub)}
.att-mark{
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.8rem;background:var(--bg);color:var(--sub);
}
.att-mark.on{background:var(--primary);color:#fff}

/* ===== Section heading ===== */
.view-title{font-size:1.25rem;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.view-title .sub{font-size:.85rem;color:var(--sub);font-weight:500}

/* ===== Admin ===== */
.admin-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.admin-tabs button{
  padding:9px 18px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);font-weight:600;font-size:.92rem;color:var(--sub);
}
.admin-tabs button.active{background:var(--primary);border-color:var(--primary);color:#fff}
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.stat-card{padding:20px;text-align:center}
.stat-card .sv{font-size:1.8rem;font-weight:900;color:var(--primary)}
.stat-card .sk{font-size:.85rem;color:var(--sub);margin-top:2px}
.table-scroll{overflow-x:auto}
.admin-table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px}
.admin-table th{
  background:#FAFAFB;color:var(--sub);font-size:.78rem;font-weight:600;
  padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;
}
.admin-table td{padding:10px 14px;border-bottom:1px solid var(--bg);vertical-align:middle}
.admin-table select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:.85rem;outline:none}
.admin-table .t-title{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.admin-table .t-title:hover{color:var(--primary)}
.del-btn{color:var(--pastor);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:.8rem;font-weight:600;background:var(--card)}
.del-btn:hover{background:#FBEAE8;border-color:var(--pastor)}
.pin-btn{border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:.8rem;font-weight:600;color:var(--sub);background:var(--card)}
.pin-btn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.att-toggle{
  width:26px;height:26px;border-radius:50%;background:var(--bg);color:var(--sub);
  font-size:.75rem;display:inline-flex;align-items:center;justify-content:center;
}
.att-toggle.on{background:var(--primary);color:#fff}
.status-pill{font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:10px;white-space:nowrap}
.status-pill.ok{background:#E8F6EC;color:#27AE60}
.status-pill.wait{background:#FFF4E0;color:#E67E22}
.approve-btn{background:var(--primary);color:#fff;border-radius:6px;padding:5px 11px;font-size:.8rem;font-weight:700}
.team-pill{
  border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:.78rem;
  font-weight:600;color:var(--sub);background:var(--card);white-space:nowrap;
}
.team-pill.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.admin-section-title{font-size:.95rem;font-weight:700;padding:14px 16px;border-bottom:1px solid var(--line)}
.persona-select{
  border:none;background:none;font-weight:600;font-size:.9rem;outline:none;cursor:pointer;
  max-width:150px;font-family:inherit;color:var(--text);
}

/* ===== 학생관리 (케어 알림 + 모달) ===== */
.care-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.care-card{padding:16px}
.care-card h4{font-size:.92rem;font-weight:700;margin-bottom:8px}
.care-card h4 .n{color:var(--primary)}
.care-person{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bg);cursor:pointer}
.care-person:last-child{border:none}
.care-person:hover b{color:var(--primary)}
.cp-sub{color:var(--sub);font-size:.78rem;margin-left:4px}
.cp-note{font-size:.8rem;color:var(--sub);margin-top:1px}
.cp-empty{color:var(--sub);font-size:.85rem;padding:8px 0}
.care-badge{font-size:.66rem;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:3px;white-space:nowrap}
.care-badge.sick{background:#FFF4E0;color:#E67E22}
.care-badge.new{background:#E8F6EC;color:#27AE60}
.care-badge.watch{background:#FBEAE8;color:var(--pastor)}
.care-badge.bday{background:#F3E8FD;color:#8E44AD}
.care-badge.absent{background:#FBEAE8;color:var(--pastor)}
.modal-bg{
  position:fixed;inset:0;background:rgba(20,20,25,.5);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.modal{
  background:var(--card);border-radius:16px;max-width:560px;width:100%;
  max-height:88vh;overflow-y:auto;padding:24px;
}
.modal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.modal-x{margin-left:auto;font-size:1.05rem;color:var(--sub);padding:6px 10px;border-radius:8px}
.modal-x:hover{background:var(--bg)}
.info-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;
  background:var(--bg);border-radius:10px;padding:14px;font-size:.9rem;
}
.info-grid .k{color:var(--sub);margin-right:8px;font-size:.8rem}
.modal-label{font-weight:700;font-size:.9rem;margin:16px 0 8px}
.modal select,.modal input[type=text]{
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;font-size:.9rem;
}
.memo-item{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:.87rem;margin-bottom:6px}
.memo-item .d{color:var(--sub);font-size:.75rem;margin-right:6px}
.att-toggle-lg{width:38px;height:38px;border-radius:10px;font-size:.72rem;flex-direction:column;gap:0}
@media(max-width:980px){.care-grid{grid-template-columns:minmax(0,1fr)}}

/* ===== 포인트 ===== */
.points-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:720px){.points-grid{grid-template-columns:minmax(0,1fr)}}
.pt-hero{background:linear-gradient(135deg,#8E44AD,#C06BD6);color:#fff;border:none;text-align:center}
.pt-hero .pv{font-size:2.3rem;font-weight:900}
.pt-btn{background:#fff;color:#8E44AD;font-weight:800;border-radius:24px;padding:10px 22px;margin-top:12px}
.pt-btn:disabled{opacity:.55;cursor:default}
.verse-box{
  background:var(--bg);border-radius:10px;padding:14px;font-size:1.02rem;line-height:1.7;
  user-select:none;-webkit-user-select:none;
}
.verse-box .ref{color:var(--primary);font-weight:700;font-size:.85rem}
.pt-rule{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bg);font-size:.9rem}
.pt-rule:last-child{border:none}
.pt-rule b{color:var(--primary)}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg)}
.rank-row:last-child{border:none}
.rank-row .medal{width:24px;text-align:center;font-weight:800}
.rank-row .pts{margin-left:auto;font-weight:800;color:var(--primary);white-space:nowrap}
.shop-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg)}
.shop-item .cost{margin-left:auto;font-weight:800;color:var(--primary);white-space:nowrap}
.shop-item button{background:var(--primary);color:#fff;font-weight:700;border-radius:8px;padding:6px 12px;font-size:.82rem;flex-shrink:0}
.log-row{display:flex;gap:8px;padding:6px 0;font-size:.85rem;border-bottom:1px solid var(--bg)}
.log-row:last-child{border:none}
.log-row .amt{margin-left:auto;font-weight:700;white-space:nowrap}
.amt.plus{color:#27AE60}
.amt.minus{color:var(--pastor)}

/* ===== 토스트·알림 ===== */
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:#222;color:#fff;padding:11px 22px;border-radius:26px;font-weight:700;
  z-index:300;animation:toastup 2.2s forwards;white-space:nowrap;
}
@keyframes toastup{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
.bell{position:relative;padding:7px;flex-shrink:0;color:#555;border-radius:8px}
.bell:hover{background:var(--bg)}
.bell svg{width:20px;height:20px;display:block}
.bell-dot{position:absolute;top:4px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--primary)}
.noti-panel{
  position:absolute;top:56px;right:16px;width:300px;max-height:380px;overflow-y:auto;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 8px 30px rgba(0,0,0,.12);z-index:90;padding:6px 0;
}
.noti-item{padding:9px 14px;font-size:.86rem;border-bottom:1px solid var(--bg)}
.noti-item:last-child{border:none}
.noti-item .nd{color:var(--sub);font-size:.72rem;margin-top:2px}

/* ===== 댓글 삭제 · 사진 ===== */
.cmt-del{margin-left:auto;color:var(--sub);font-size:.76rem;padding:2px 7px;border-radius:5px}
.cmt-del:hover{background:#FBEAE8;color:var(--pastor)}
.post-img{max-width:100%;border-radius:10px;margin:12px 0 0;display:block}
.dday-apply{
  background:rgba(255,255,255,.25);color:#fff;font-weight:800;border-radius:20px;
  padding:8px 16px;margin-top:12px;font-size:.88rem;
}
.dday-apply:hover{background:rgba(255,255,255,.35)}

/* ===== 모바일 전체 메뉴 시트 ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(20,20,25,.45);z-index:120;display:flex;align-items:flex-end}
.sheet{
  background:var(--card);border-radius:18px 18px 0 0;width:100%;
  padding:18px 16px 28px;animation:sheetup .22s ease;
}
@keyframes sheetup{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet-search{display:flex;gap:8px;margin-bottom:14px}
.sheet-search input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;font-size:.95rem;min-width:0}
.sheet-search input:focus{border-color:var(--primary)}
.sheet-search button{background:var(--primary);color:#fff;font-weight:700;border-radius:10px;padding:0 16px;flex-shrink:0}
.sheet-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sheet-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;
  border:1px solid var(--line);border-radius:12px;font-size:.8rem;font-weight:600;color:var(--text);
  background:var(--card);
}
.sheet-item:active{background:var(--primary-soft)}
.sheet-item .ico{font-size:1.5rem}

/* ===== Mobile ===== */
.mobile-nav{display:none}
@media (max-width:1280px){
  .layout{grid-template-columns:200px minmax(0,1fr) 280px;gap:16px;padding:16px}
  html{font-size:14px}
}
@media (max-width:980px){
  .layout{grid-template-columns:200px minmax(0,1fr)}
  #rightbar{display:none}
}
@media (max-width:720px){
  html{font-size:13.5px}
  .layout{grid-template-columns:minmax(0,1fr);padding:12px;padding-bottom:70px}
  #leftbar{display:none}
  .gnb{display:none}
  .search{display:none}
  .header-inner{justify-content:space-between}
  .home-grid,.prayer-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .post-row .views{display:none}
  .post-row .author{width:auto}
  .list-cols{display:none}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:var(--card);border-top:1px solid var(--line);padding:6px 0 10px;
  }
  .mobile-nav button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:.68rem;color:var(--sub);font-weight:600;
  }
  .mobile-nav button.active{color:var(--primary)}
  .mobile-nav .ico{font-size:1.25rem}
}
.hidden{display:none!important}
.empty{padding:40px;text-align:center;color:var(--sub);font-size:.9rem}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo" onclick="showView('home')">
      <div class="mark">안</div>
      <div class="name">안천 <span>청소년부</span></div>
    </div>
    <nav class="gnb">
      <button data-nav="home" class="active" onclick="showView('home')">홈</button>
      <button data-nav="board" onclick="openBoard('free')">게시판</button>
      <button data-nav="prayer" onclick="showView('prayer')">기도제목</button>
      <button data-nav="calendar" onclick="showView('calendar')">일정</button>
      <button data-nav="attendance" onclick="showView('attendance')">출석체크</button>
      <button data-nav="points" onclick="showView('points')">🎁 포인트</button>
      <button data-nav="admin" id="adminNavBtn" class="hidden" onclick="showView('admin')">🛠️ 관리</button>
    </nav>
    <div class="search">🔍<input id="searchInput" placeholder="게시글 검색" onkeydown="if(event.key==='Enter')doSearch()"></div>
    <button class="bell" onclick="toggleNoti()" title="알림" aria-label="알림">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="bell-dot hidden" id="bellDot"></span>
    </button>
    <div class="user-chip" id="userChip"></div>
  </div>
  <div class="noti-panel hidden" id="notiPanel"></div>
</header>

<!-- 로그인 / 가입 / 승인 대기 -->
<div id="authView" class="auth-wrap hidden">
  <div class="auth-card" id="authCard"></div>
</div>

<div class="layout">

  <!-- ===== Left sidebar ===== -->
  <aside id="leftbar">
    <button class="write-btn" onclick="showView('write')">✏️ 글쓰기</button>
    <div class="card side-section">
      <div class="side-title">커뮤니티</div>
      <div class="side-menu" id="menuCommunity"></div>
      <div class="side-title" style="margin-top:6px">교회 소식</div>
      <div class="side-menu" id="menuChurch"></div>
      <div class="side-title" style="margin-top:6px" id="teamTitle">내 모임 🔒</div>
      <div class="side-menu" id="menuTeam"></div>
      <div class="side-title" style="margin-top:6px">바로가기</div>
      <div class="side-menu">
        <button onclick="showView('prayer')">🙏 기도제목</button>
        <button onclick="showView('calendar')">📅 일정</button>
        <button onclick="showView('attendance')">✅ 출석체크</button>
        <button onclick="showView('points')">🎁 포인트</button>
        <button onclick="openProfileModal()">📋 내 교적</button>
      </div>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <main id="main">

    <!-- 홈 -->
    <section id="view-home">
      <div class="hero" id="hero"></div>
      <div class="notice-banner" id="noticeBanner"></div>
      <div class="home-grid" id="homeGrid"></div>
    </section>

    <!-- 게시판 -->
    <section id="view-board" class="hidden">
      <div class="card">
        <div class="board-head" id="boardHead"></div>
        <div class="list-cols">
          <div class="c-num">번호</div><div class="c-title">제목</div>
          <div class="c-author">작성자</div><div class="c-time">시간</div>
          <div class="c-views">조회</div><div class="c-likes">추천</div>
        </div>
        <div id="postList"></div>
      </div>
    </section>

    <!-- 글 상세 -->
    <section id="view-post" class="hidden">
      <span class="back-link" id="postBack">‹ 목록으로</span>
      <div class="card post-detail" id="postDetail"></div>
    </section>

    <!-- 글쓰기 -->
    <section id="view-write" class="hidden">
      <div class="view-title">✏️ 글쓰기</div>
      <div class="card write-form">
        <select id="wBoard" onchange="updatePinRow()"></select>
        <label id="pinRow" class="hidden" style="align-items:center;gap:8px;font-size:.92rem;font-weight:600;display:flex">
          <input type="checkbox" id="wPin"> 📌 공지로 등록 <span style="color:var(--sub);font-weight:400">(찬양팀 콘티, 임원단 공지)</span>
        </label>
        <input id="wTitle" placeholder="제목을 입력하세요" maxlength="60">
        <textarea id="wBody" placeholder="내용을 입력하세요. 따뜻하고 배려있는 글로 함께 좋은 공간을 만들어요 :)"></textarea>
        <label style="display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--sub);cursor:pointer">
          📷 사진 첨부 (선택)
          <input type="file" id="wImg" accept="image/*" onchange="handleImg(this)" style="font-size:.82rem">
        </label>
        <img id="wImgPrev" class="hidden" style="max-width:240px;border-radius:10px" alt="첨부 미리보기">
        <button class="write-submit" onclick="submitPost()">등록하기</button>
      </div>
    </section>

    <!-- 기도제목 -->
    <section id="view-prayer" class="hidden">
      <div class="view-title">🙏 기도제목 나눔 <span class="sub">서로의 기도제목을 두고 함께 기도해요</span></div>
      <div class="card prayer-form">
        <input id="prayerInput" placeholder="나누고 싶은 기도제목을 적어주세요" onkeydown="if(event.key==='Enter')addPrayer()">
        <button onclick="addPrayer()">나누기</button>
      </div>
      <div class="prayer-grid" id="prayerGrid"></div>
    </section>

    <!-- 일정 -->
    <section id="view-calendar" class="hidden">
      <div class="view-title">📅 청소년부 일정</div>
      <div class="card" style="margin-bottom:12px">
        <div class="cal-head">
          <button onclick="moveMonth(-1)">‹</button>
          <h2 id="calTitle"></h2>
          <button onclick="moveMonth(1)">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div class="card event-list">
        <h3 style="font-size:.95rem;font-weight:700;margin-bottom:6px">다가오는 일정</h3>
        <div id="eventList"></div>
      </div>
    </section>

    <!-- 출석체크 -->
    <section id="view-attendance" class="hidden">
      <div class="view-title">✅ 출석체크</div>
      <div class="card att-hero">
        <div class="streak" id="attStreak"></div>
        <p>나의 출석 현황을 확인해 보세요</p>
        <p style="margin-top:10px;font-size:.92rem;color:var(--primary);font-weight:600">출석 체크는 예배 후 담당 선생님이 해 주세요 😊</p>
      </div>
      <div class="card att-weeks" style="margin-top:12px">
        <h3 style="font-size:.95rem;font-weight:700;margin-bottom:6px" id="attMonthTitle">출석 현황</h3>
        <div id="attWeeks"></div>
      </div>
    </section>

    <!-- 포인트 -->
    <section id="view-points" class="hidden">
      <div class="view-title">🎁 포인트 <span class="sub">활동하고 포인트 모아서 상품 받자!</span></div>
      <div id="pointsBody"></div>
    </section>

    <!-- 관리자 -->
    <section id="view-admin" class="hidden">
      <div class="view-title">🛠️ 관리자 페이지 <span class="sub">교사·교역자 · 웹 관리자</span></div>
      <div class="admin-tabs">
        <button class="active" data-atab="dash" onclick="showAdminTab('dash')">📊 대시보드</button>
        <button data-atab="students" onclick="showAdminTab('students')">🧑‍🎓 학생관리</button>
        <button data-atab="members" onclick="showAdminTab('members')">👥 멤버 관리</button>
        <button data-atab="posts" onclick="showAdminTab('posts')">📝 게시글 관리</button>
        <button data-atab="banner" onclick="showAdminTab('banner')">🖼️ 배너 관리</button>
        <button data-atab="events" onclick="showAdminTab('events')">📅 일정 관리</button>
      </div>
      <div id="adminBody"></div>
    </section>

    <!-- 검색 결과 -->
    <section id="view-search" class="hidden">
      <div class="view-title">🔍 검색 결과 <span class="sub" id="searchInfo"></span></div>
      <div class="card"><div id="searchList"></div></div>
    </section>

  </main>

  <!-- ===== Right sidebar ===== -->
  <aside id="rightbar">
    <div class="card widget dday" id="ddayWidget"></div>
    <div class="card widget" id="worshipWidget"></div>
    <div class="card widget">
      <h3>🔥 HOT 게시글 <span class="more" onclick="openBoard('free')">더보기</span></h3>
      <div id="hotList"></div>
    </div>
    <div class="card widget">
      <h3>✅ 나의 출석 <span class="more" onclick="showView('attendance')">더보기</span></h3>
      <div class="att-mini" id="attMini"></div>
    </div>
  </aside>

</div>

<!-- ===== Mobile bottom nav ===== -->
<nav class="mobile-nav">
  <button data-nav="home" class="active" onclick="showView('home')"><span class="ico">🏠</span>홈</button>
  <button data-nav="board" onclick="openBoard('free')"><span class="ico">📋</span>게시판</button>
  <button data-nav="write" onclick="showView('write')"><span class="ico">✏️</span>글쓰기</button>
  <button data-nav="points" onclick="showView('points')"><span class="ico">🎁</span>포인트</button>
  <button onclick="openSheet()"><span class="ico">☰</span>전체</button>

/* 이번 달 주일(일요일)을 자동 생성 — 매달 코드를 수정할 필요가 없어요 */
function ymdStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function monthSundays(y, m){ // m: 0부터 시작
  const list = [];
  const d = new Date(y, m, 1);
  d.setDate(1 + (7 - d.getDay()) % 7); // 이 달의 첫 주일
  while(d.getMonth() === m){ list.push(new Date(d)); d.setDate(d.getDate() + 7); }
  return list;
}
const attendance = (()=>{
  const now = new Date();
  const thisSunday = new Date(now); thisSunday.setDate(now.getDate() - now.getDay()); // 이번 주 주일
  return monthSundays(now.getFullYear(), now.getMonth()).map((d, i)=>({
    week: `${d.getMonth()+1}월 ${i+1}주 (${d.getMonth()+1}/${d.getDate()})`,
    ymd: ymdStr(d), scripture: '-',
    current: d.toDateString() === thisSunday.toDateString(),
  }));
})();

   예: { img:'images/retreat_poster.jpg', tag:'POSTER', title:'...', sub:'...', postId:1 }
   img가 없으면 grad(그라데이션) + emoji로 포스터풍 배너를 그립니다. */
let heroSlides = []; // Supabase ac_banners에서 로드
let heroIdx = 0;
function renderHero(){
  const h = document.getElementById('hero');
  h.innerHTML = heroSlides.map((s,i)=>`
    <div class="hero-slide ${i===heroIdx?'on':''}"
      style="${s.img ? `background-image:url('${esc(s.img)}')` : `background:${s.grad}`}"
      onclick="heroClick(${i})">
      ${s.img ? '' : `<span class="hs-emoji">${esc(s.emoji)}</span>`}
      <div class="hs-body">
        <span class="hs-tag">${esc(s.tag)}</span>
        <div class="hs-title">${esc(s.title)}</div>
        <div class="hs-sub">${esc(s.sub)}</div>
      </div>
    </div>`).join('')
  + `<button class="hero-arrow l" onclick="event.stopPropagation();heroGo(heroIdx-1)">‹</button>
     <button class="hero-arrow r" onclick="event.stopPropagation();heroGo(heroIdx+1)">›</button>
     <div class="hero-nav">${heroSlides.map((_,i)=>
       `<span class="hero-dot ${i===heroIdx?'on':''}" onclick="event.stopPropagation();heroGo(${i})"></span>`).join('')}</div>`;
}
function heroGo(i){
  heroIdx = (i + heroSlides.length) % heroSlides.length;
  renderHero();
}
function heroClick(i){
  const s = heroSlides[i];
  if(s.postId) openPost(s.postId);
  else if(s.boardId) openBoard(s.boardId);
}

      `<div class="bp-item" onclick="openPost(${p.id})">

/* 공지 배너 — 일반 공지 + 팀 공지(콘티 등)를 4초마다 순환 */
let noticeBannerIdx = 0;
function visibleNotices(){
  return posts.filter(p=>p.notice && canSeePost(p)).slice().reverse();
}
function renderNoticeBanner(){
  const list = visibleNotices();
  const banner = document.getElementById('noticeBanner');
  banner.classList.toggle('hidden', !list.length);
  if(!list.length) return;
  noticeBannerIdx = noticeBannerIdx % list.length;
  const n = list[noticeBannerIdx];
  const b = boards.find(x=>x.id===n.board);
  banner.innerHTML = `
    <span class="tag">${b.group==='team' ? b.icon+' '+b.name : '공지'}</span>
    <span class="txt">${esc(n.title)}</span>
    ${list.length>1?`<span class="nb-count">${noticeBannerIdx+1}/${list.length}</span>`:''}`;
  banner.onclick = ()=>openPost(n.id);
}
setInterval(()=>{
  const home = document.getElementById('view-home');
  if(home && !home.classList.contains('hidden') && visibleNotices().length>1){
    noticeBannerIdx++;
    renderNoticeBanner();
  }
}, 4000);

function renderHot(){
  const hot = posts.filter(canSeePost).slice().sort((a,b)=>b.likes-a.likes).slice(0,5);
  document.getElementById('hotList').innerHTML = hot.map((p,i)=>
    `<div class="hot-item" onclick="openPost(${p.id})">
      <span class="rank">${i+1}</span><span class="t">${esc(p.title)}</span><span class="lk">♥ ${p.likes}</span>
    </div>`).join('');
}

function openInfoModal(k){
  const v = SETTINGS[k]||{};

    ? [['time','예배 시간'],['place','장소'],['preacher','말씀(설교자)'],['scripture','본문']]
    : [['title','행사명'],['date','D-day 기준일 (YYYY-MM-DD)'],['period','기간 표시 (예: 7/24(금)~26(주일))'],['place','장소'],['fee','회비']];
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)closeStudentModal()"><div class="modal">
    <div class="modal-head"><div style="font-weight:800;font-size:1.1rem">${k==='worship'?'⛪ 예배 안내 수정':'🏕️ 행사 정보 수정'}</div>

async function saveInfo(k){
  const v = { ...(SETTINGS[k]||{}) };
  document.querySelectorAll('[id^=if_]').forEach(i=>{ v[i.id.slice(3)] = i.value.trim(); });
  const { error } = await sb.from('ac_settings').upsert({ key:k, value:v });
  if(err(error,'저장 실패')) return;
  SETTINGS[k] = v;
  closeStudentModal();
  renderInfoWidgets();
  showToast('수정 완료!');
}

    const url = await uploadPhoto(pfPendingImg);
    if(url){ await sb.rpc('ac_set_photo', { url }); ME.photo = await signedOrOriginal(url); }
    pfPendingImg = null;
  }
  const upd = {
    birthday: document.getElementById('pfBirth').value || '-',
    school: document.getElementById('pfSchool').value.trim() || '-',
    phone: document.getElementById('pfPhone').value.trim() || '-',
    guardian_phone: document.getElementById('pfGuard').value.trim() || '-',
  };
  const { error } = await sb.from('ac_member_private').update(upd).eq('member_id', MYID);
  if(err(error,'저장 실패')) return;
  ME.birthday=upd.birthday; ME.school=upd.school; ME.phone=upd.phone; ME.guardianPhone=upd.guardian_phone;
  closeStudentModal();
  renderUserChip();
  const r = await earn('profile');
  if(r===-2) showToast('교적이 저장됐어요! 모두 채우면 +100P 🎁');
  else if(r===-1) showToast('교적이 수정됐어요!');

let currentBoard = 'free';
function openBoard(id){
  const b = boards.find(x=>x.id===id);
  if(!canSeeBoard(b)){
    alert(`${b.name} 게시판은 소속 멤버만 볼 수 있어요 🔒`);
    return;
  }
  currentBoard = id;
  showView('board');
  const mb = document.getElementById('menu-'+id);
  if(mb) mb.classList.add('active');
  document.getElementById('boardHead').innerHTML =
    `<h2>${b.icon} ${b.name}${b.private?' <span style="font-size:.72rem;color:var(--sub);font-weight:600;vertical-align:middle">🔒 멤버 전용</span>':''}</h2><span class="desc">${b.desc}</span>
     <button class="bh-write" onclick="showView('write');document.getElementById('wBoard').value='${id}'">글쓰기</button>`;
  let list = posts.filter(p=>p.board===id).slice().reverse();
  if(id==='notice') list = [...teamNotices().slice().reverse(), ...list]; // 팀 공지를 전체 공지에 합류
  document.getElementById('postList').innerHTML = list.length ? list.map((p,i)=>
    `<div class="post-row" onclick="openPost(${p.id})">
      <span class="num ${p.notice?'notice-tag':''}">${p.notice?'공지':list.length-i}</span>
      <div class="title-wrap">
        ${p.board!==id?`<span class="badge origin">${boards.find(x=>x.id===p.board).icon} ${boards.find(x=>x.id===p.board).name}</span>`:''}
        ${p.likes>=15?'<span class="badge hot-badge">HOT</span>':''}
        <span class="title">${esc(p.title)}</span>
        ${p.comments.length?`<span class="cmt">[${p.comments.length}]</span>`:''}
      </div>
      <span class="author">${esc(p.author)}${badge(p.role)}</span>
      <span class="time">${p.time}</span>
      <span class="views">${p.views}</span>
      <span class="likes">${p.likes}</span>
    </div>`).join('') : '<div class="empty">아직 글이 없어요. 첫 글을 남겨보세요!</div>';
}

/* ================= 글 상세 ================= */
let currentPost = null;
function openPost(id){
  const p = posts.find(x=>x.id===id);
  if(!p) return;
  if(!canSeePost(p)){
    const b = boards.find(x=>x.id===p.board);
    alert(`${b.name} 게시판은 소속 멤버만 볼 수 있어요 🔒`);
    return;
  }
  currentPost = p;
  p.views++;
  sb.rpc('ac_inc_views', { pid:p.id }).then(()=>{});
  showView('post');
  document.getElementById('postBack').onclick = ()=>openBoard(p.board);
  renderPostDetail();
}

function renderPostDetail(){
  const p = currentPost;
  const b = boards.find(x=>x.id===p.board);
  const cmts = p.comments.map((c,i)=>
    `<div class="comment">
      <div class="ch"><span class="ca">${esc(c.author)}${badge(c.role)}</span><span class="ct">${c.time}</span>
        ${canModerate()?`<button class="cmt-del" title="댓글 삭제 (관리자)" onclick="deleteComment(${i})">✕ 삭제</button>`:''}</div>
      <div class="cb">${esc(c.body)}</div>
    </div>`).join('');
  document.getElementById('postDetail').innerHTML = `
    <span class="pd-board" onclick="openBoard('${b.id}')">${b.icon} ${b.name} ›</span>
    ${!canSeeBoard(b)?`<div style="background:var(--primary-soft);color:var(--primary);font-size:.82rem;font-weight:600;padding:8px 12px;border-radius:8px;margin-bottom:10px">📢 ${b.name} 게시판의 공지글이라 전체 구성원에게 공개된 글이에요</div>`:''}
    <div class="pd-title">${esc(p.title)}</div>
    <div class="pd-meta">
      <span class="author"><span class="avatar">${esc(p.author.slice(0,2))}</span>${esc(p.author)}${badge(p.role)}</span>
      <span>${p.time}</span><span>조회 ${p.views}</span>
    </div>
    ${p.img?`<img class="post-img" src="${esc(p.img)}" alt="첨부 사진">`:''}
    <div class="pd-body">${esc(p.body)}</div>
    <div class="pd-actions">
      <button class="act-btn ${p.liked?'on':''}" onclick="toggleLike()">👍 좋아요 ${p.likes}</button>
      <button class="act-btn" onclick="alert('프로토타입에서는 준비 중인 기능이에요 :)')">🔗 공유</button>
    </div>
    <div class="cmt-count">댓글 <span>${p.comments.length}</span></div>
    ${cmts || '<div class="empty" style="padding:20px">첫 댓글을 남겨보세요!</div>'}
    <div class="cmt-form">
      <input id="cmtInput" placeholder="따뜻한 댓글을 남겨주세요 :)" onkeydown="if(event.key==='Enter')addComment()">
      <button onclick="addComment()">등록</button>
    </div>`;
}

function toggleLike(){
  const p = currentPost;
  p.liked = !p.liked;
  p.likes += p.liked ? 1 : -1;
  renderPostDetail();
  if(p.liked) sb.from('ac_post_likes').insert({ post_id:p.id, member_id:MYID }).then(()=>{});
  else sb.from('ac_post_likes').delete().eq('post_id',p.id).eq('member_id',MYID).then(()=>{});
}

async function addComment(){
  const inp = document.getElementById('cmtInput');
  const v = inp.value.trim();
  if(!v) return;
  const { data, error } = await sb.from('ac_comments')
    .insert({ post_id:currentPost.id, author:MYID, body:v }).select().single();
  if(err(error,'댓글 등록 실패')) return;
  currentPost.comments.push({ _id:data.id, author:ME.name, role:ME.role, time:'방금', body:v });
  earn('comment');
  renderPostDetail();
  renderSidebar();
}

/* 댓글 삭제: 교사·교역자·웹 관리자 */
function canModerate(){ return isStaff() || !!(ME && ME.siteAdmin); }
async function deleteComment(i){
  if(!confirm('이 댓글을 삭제할까요?')) return;
  const c = currentPost.comments[i];
  if(c._id){ const { error } = await sb.from('ac_comments').delete().eq('id', c._id); if(err(error,'삭제 실패')) return; }
  currentPost.comments.splice(i,1);
  renderPostDetail();
}

/* 팀 게시판 공지(콘티 등) 등록 권한: 해당 팀 소속이거나 교사·교역자 */
function updatePinRow(){
  const b = boards.find(x=>x.id===document.getElementById('wBoard').value);
  const can = !!(b && b.private && (ME.role!=='student' || (ME.teams||[]).includes(b.private)));
  document.getElementById('pinRow').classList.toggle('hidden', !can);
  if(!can) document.getElementById('wPin').checked = false;
}
async function submitPost(){
  const board = document.getElementById('wBoard').value;
  const title = document.getElementById('wTitle').value.trim();
  const body  = document.getElementById('wBody').value.trim();
  if(!title){ alert('제목을 입력해 주세요!'); return; }
  if(!body){ alert('내용을 입력해 주세요!'); return; }
  const pin = board==='notice' || document.getElementById('wPin').checked;
  let img_url = null;
  if(pendingImg){ img_url = await uploadPhoto(pendingImg); pendingImg = null; }
  const { data, error } = await sb.from('ac_posts')
    .insert({ board, title, body, notice:pin, img_url, author:MYID }).select().single();
  if(err(error,'글 등록 실패')) return;
  posts.push({ id:data.id, board, title, body, img:await signedOrOriginal(img_url), notice:pin, views:0,
    author:ME.name, role:ME.role, _aid:MYID, time:'방금', likes:0, liked:false, comments:[] });
  document.getElementById('wTitle').value='';
  document.getElementById('wBody').value='';
  document.getElementById('wPin').checked=false;
  document.getElementById('wImg').value='';
  document.getElementById('wImgPrev').classList.add('hidden');
  earn('post');
  if(pin) addNoti(`📢 새 공지: ${title}`, false);
  renderSidebar();
  openBoard(board);
}

/* ================= 일정 ================= */
let calY = new Date().getFullYear(), calM = new Date().getMonth();
function moveMonth(d){
  calM += d;
  if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;}
  renderCalendar();
}
function renderCalendar(){
  document.getElementById('calTitle').textContent = `${calY}년 ${calM+1}월`;
  const first = new Date(calY,calM,1).getDay();
  const days = new Date(calY,calM+1,0).getDate();
  const today = new Date();
  let html = ['일','월','화','수','목','금','토'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<first;i++) html += '<div class="cal-cell"></div>';
  for(let d=1;d<=days;d++){
    const ds = `${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = events.filter(e=>e.date===ds).map(e=>`<div class="cal-ev">${esc(e.title)}</div>`).join('');
    const isToday = today.getFullYear()===calY && today.getMonth()===calM && today.getDate()===d;
    html += `<div class="cal-cell ${isToday?'today':''}"><span class="d">${d}</span>${evs}</div>`;
  }
  document.getElementById('calGrid').innerHTML = html;

  const upcoming = events.filter(e=>new Date(e.date) >= new Date(new Date().toDateString()));
  document.getElementById('eventList').innerHTML = upcoming.map(e=>{
    const dt = new Date(e.date);
    return `<div class="event-item">
      <div class="ed"><div class="m">${dt.getMonth()+1}월</div><div class="dd">${dt.getDate()}</div></div>
      <div><div class="et">${esc(e.title)}</div><div class="es">${esc(e.sub)}</div></div>
    </div>`;
  }).join('') || '<div class="empty" style="padding:16px">다가오는 일정이 없어요</div>';
}

function renderAttendance(){
  const my = ME.att;
  document.getElementById('attMonthTitle').textContent = (new Date().getMonth()+1) + '월 출석 현황';
  const n = my.filter(Boolean).length;
  document.getElementById('attStreak').textContent =
    n ? `🔥 이번 달 ${n}회 출석!` : '이번 달 출석 0회';
  document.getElementById('attWeeks').innerHTML = attendance.map((a,i)=>
    `<div class="att-week-row">
      <span class="att-mark ${my[i]?'on':''}">${my[i]?'✓':'·'}</span>
      <span class="w">${a.week}${a.current?' <span style="color:var(--primary);font-size:.75rem">이번 주</span>':''}</span>
      <span class="s">${a.scripture}</span>
    </div>`).join('');
}

/* ================= 관리자 ================= */
let currentAdminTab = 'dash';
const staffOnlyTabs = ['students','members','events']; // 교사·교역자 전용
function showAdminTab(tab){
  if(staffOnlyTabs.includes(tab) && !isStaff()) tab = 'dash';
  currentAdminTab = tab;
  document.querySelectorAll('[data-atab]').forEach(b=>{
    b.classList.toggle('active', b.dataset.atab===tab);
    b.classList.toggle('hidden', staffOnlyTabs.includes(b.dataset.atab) && !isStaff());
  });
  const el = document.getElementById('adminBody');
  if(tab==='dash')     el.innerHTML = adminDash();
  if(tab==='students') el.innerHTML = adminStudents();
  if(tab==='members')  el.innerHTML = adminMembers();
  if(tab==='posts')    el.innerHTML = adminPosts();
  if(tab==='banner')   el.innerHTML = adminBanner();
  if(tab==='events')   el.innerHTML = adminEvents();
}

/* ----- 일정 관리 ----- */
function adminEvents(){
  const list = events.slice().sort((a,b)=>a.date.localeCompare(b.date));
  return `
  <div class="card table-scroll" style="margin-bottom:16px"><table class="admin-table">
  <tr><th>날짜</th><th>일정</th><th>설명</th><th></th></tr>
  ${list.length ? list.map(e=>`<tr>
    <td style="white-space:nowrap">${esc(e.date)}</td>
    <td style="white-space:nowrap"><b>${esc(e.title)}</b></td>
    <td>${esc(e.sub)}</td>
    <td><button class="del-btn" onclick="eventDelete(${e._id})">삭제</button></td>
  </tr>`).join('') : '<tr><td colspan="4" class="empty">등록된 일정이 없어요</td></tr>'}
  </table></div>
  <div class="card" style="padding:18px">
    <div style="font-weight:700;margin-bottom:12px">➕ 새 일정 추가</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <input type="date" id="evDate" style="border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none">
      <input type="text" id="evTitle" placeholder="일정 이름 *" style="border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none">
      <input type="text" id="evSub" placeholder="설명 (시간·장소 등, 선택)" style="border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;grid-column:1/-1">
    </div>
    <button class="approve-btn" style="margin-top:12px;padding:10px 22px" onclick="eventAdd()">일정 추가</button>
  </div>`;
}
async function eventAdd(){
  const d = document.getElementById('evDate').value;
  const title = document.getElementById('evTitle').value.trim();
  const sub = document.getElementById('evSub').value.trim();
  if(!d){ alert('날짜를 선택해 주세요!'); return; }
  if(!title){ alert('일정 이름을 입력해 주세요!'); return; }
  const { data, error } = await sb.from('ac_events').insert({ d, title, sub }).select().single();
  if(err(error,'일정 추가 실패')) return;
  events.push({ _id:data.id, date:data.d, title:data.title, sub:data.sub });
  showAdminTab('events');
  showToast('일정이 추가됐어요!');
}
async function eventDelete(id){
  const e = events.find(x=>x._id===id);
  if(!confirm(`"${e.title}" 일정을 삭제할까요?`)) return;
  const { error } = await sb.from('ac_events').delete().eq('id', id);
  if(err(error,'삭제 실패')) return;
  events = events.filter(x=>x._id!==id);
  showAdminTab('events');
}

  const rate = (students.length && doneIdx >= 0) ? Math.round(students.filter(m=>m.att[doneIdx]).length / students.length * 100) : 0;
  const wait = members.filter(m=>m.status==='wait');

    <div class="card stat-card"><div class="sv">${totalCmts}</div><div class="sk">전체 댓글</div></div>
    <div class="card stat-card"><div class="sv">${rate}%</div><div class="sk">${doneIdx>=0 ? '최근 주일 출석률 ('+attendance[doneIdx].week.match(/\((.*)\)/)[1]+')' : '출석률'}</div></div>
  </div>
  ${!isStaff() ? `<div class="card" style="padding:12px 16px;margin-bottom:16px;font-size:.88rem;color:var(--sub)">

  <div class="card" style="margin-bottom:16px">
    <div class="admin-section-title">⏳ 가입 승인 대기 (${wait.length})</div>
    ${wait.length ? wait.map(m=>`
      <div style="display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bg)">
        <span class="avatar">${esc(m.name.slice(1,3))}</span><b>${esc(m.name)}</b>
        <span style="color:var(--sub);font-size:.85rem">${esc(m.cls)} · ${esc(m.joined)} 신청</span>
        <button class="approve-btn" style="margin-left:auto" onclick="approveMember(this.dataset.n)" data-n="${esc(m.name)}">승인</button>
      </div>`).join('')

  <div class="card">
    <div class="admin-section-title">🕐 최근 게시글</div>
    <div style="padding:6px 0">
    ${recent.map(p=>`<div class="bp-item" style="padding:8px 16px" onclick="openPost(${p.id})">
      <span class="t">${esc(p.title)}</span><span class="meta">${esc(p.author)} · ${p.time}</span></div>`).join('')}
    </div>
  </div>
  ${isStaff()?`
  <div class="card" style="margin-top:16px">
    <div class="admin-section-title">🏕️ 수련회 신청 현황 (${retreatApps.length}명)</div>
    ${retreatApps.length ? retreatApps.map(a=>`
      <div style="display:flex;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--bg);flex-wrap:wrap">

async function toggleSiteAdmin(i){
  const m = members[i];
  const { data, error } = await sb.from('ac_members').update({ site_admin:!m.siteAdmin }).eq('id', m.id).select('id');
  if(err(error,'변경 실패')) return;
  if(!data || !data.length){ alert('변경이 저장되지 않았어요 — 교사·교역자 계정인지 확인해 주세요'); return; }
  m.siteAdmin = !m.siteAdmin;
  showAdminTab('members');
  if(m===ME) document.getElementById('adminNavBtn').classList.toggle('hidden', !canAdmin());
}

async function toggleTeam(i, team){
  const m = members[i];
  const next = (m.teams||[]).includes(team) ? m.teams.filter(t=>t!==team) : [...(m.teams||[]), team];
  const { data, error } = await sb.from('ac_members').update({ teams:next }).eq('id', m.id).select('id');
  if(err(error,'변경 실패')) return;
  if(!data || !data.length){ alert('변경이 저장되지 않았어요 — 교사·교역자 계정인지 확인해 주세요'); return; }
  m.teams = next;
  showAdminTab('members');
  renderSidebar();
}

  const absent = students.filter(s=>weeksAbsent(s)>=3);
  const cares  = students.filter(s=>s.care);
  const person = (s, note) => `
    <div class="care-person" onclick="openStudentModal(${members.indexOf(s)})">
      <span class="avatar">${esc(s.name.slice(1,3))}</span>
      <div><b>${esc(s.name)}</b><span class="cp-sub">${esc(s.cls)}</span><div class="cp-note">${esc(note)}</div></div>
    </div>`;
  return `
  <div class="care-grid">
    <div class="card care-card">
      <h4>🎂 이번 달 생일 <span class="n">${bdays.length}</span></h4>
      ${bdays.length ? bdays.map(s=>person(s, s.birthday.slice(5).replace('-','/')+' 생일 — 축하해 주세요!')).join('') : '<div class="cp-empty">이번 달 생일인 친구가 없어요</div>'}
    </div>
    <div class="card care-card">
      <h4>🚨 장기결석 <span class="n">${absent.length}</span></h4>
      ${absent.length ? absent.map(s=>person(s, `최근 출석 ${s.lastAttended} · ${weeksAbsent(s)}주째 결석 — 연락이 필요해요`)).join('') : '<div class="cp-empty">3주 이상 결석한 친구가 없어요</div>'}
    </div>
    <div class="card care-card">
      <h4>💛 집중케어 <span class="n">${cares.length}</span></h4>
      ${cares.length ? cares.map(s=>person(s, `${careTypes[s.care]}${s.careNote?' · '+s.careNote:''}`)).join('') : '<div class="cp-empty">집중케어 중인 친구가 없어요</div>'}
    </div>
  </div>
  <div class="card table-scroll">
    <div class="admin-section-title">학생 명단 · 출석 체크
      <span style="color:var(--sub);font-weight:400;font-size:.8rem">주차 동그라미를 눌러 출석을 체크하세요</span></div>
    <table class="admin-table">
    <tr><th>이름</th><th>반</th><th>학교</th><th>생일</th>
      ${attendance.map(a=>`<th style="text-align:center">${a.week.match(/\((.*)\)/)[1]}${a.current?'<br><span style="color:var(--primary)">이번주</span>':''}</th>`).join('')}
      <th style="text-align:center">출석</th><th></th></tr>
    ${students.map(s=>{
      const mi = members.indexOf(s);
      return `<tr>
        <td style="white-space:nowrap"><b>${esc(s.name)}</b>${careBadges(s)}${s.status==='wait'?' <span class="status-pill wait">승인대기</span>':''}</td>
        <td style="white-space:nowrap">${esc(s.cls)}</td>
        <td style="white-space:nowrap">${esc(s.school)}</td>
        <td style="white-space:nowrap">${s.birthday.slice(5).replace('-','/')}</td>
        ${s.att.map((on,wi)=>`<td style="text-align:center">

        <td style="text-align:center;font-weight:700;color:var(--primary)">${s.att.filter(Boolean).length}회</td>

function closeStudentModal(){ document.getElementById('modalRoot').innerHTML=''; }
async function setCare(mi, val){
  const { error } = await sb.from('ac_member_private').update({ care: val||null }).eq('member_id', members[mi].id);
  if(err(error,'변경 실패')) return;
  members[mi].care = val || null;
  showAdminTab('students'); openStudentModal(mi);
}
async function setCareNote(mi, val){
  const { error } = await sb.from('ac_member_private').update({ care_note: val }).eq('member_id', members[mi].id);
  if(err(error,'변경 실패')) return;
  members[mi].careNote = val;
  showAdminTab('students');
}
async function addStudentMemo(mi){
  const inp = document.getElementById('memoInput');
  const v = inp.value.trim();
  if(!v) return;
  const { data, error } = await sb.from('ac_care_memos')
    .insert({ member_id:members[mi].id, author:MYID, text:v }).select().single();
  if(err(error,'기록 실패')) return;
  members[mi].memos.unshift({ _id:data.id, date:todayMD(), text:v });
  openStudentModal(mi);
}

async function approveMember(name){
  const m = members.find(x=>x.name===name);
  if(!m) return;
  // RPC 사용: RLS로 인한 '조용한 실패' 방지 — 실패하면 명확한 오류가 표시됩니다
  const { error } = await sb.rpc('ac_approve_member', { target:m.id });
  if(err(error,'승인 실패')) return;
  m.status = 'ok';
  showAdminTab(currentAdminTab);
  showToast(`${m.name} 님 가입 승인 완료! 🎉`);
}
async function changeRole(i, role){
  const { data, error } = await sb.from('ac_members').update({ role }).eq('id', members[i].id).select('id');
  if(err(error,'변경 실패')) return;
  if(!data || !data.length){ alert('변경이 저장되지 않았어요 — 교사·교역자 계정인지 확인해 주세요'); return; }
  members[i].role = role;
  showAdminTab('members');
}
async function toggleNotice(id){
  const p = posts.find(x=>x.id===id);

async function bannerMove(i, dir){
  const j = i + dir;
  if(j<0 || j>=heroSlides.length) return;
  const a = heroSlides[i], b = heroSlides[j];
  await Promise.all([
    sb.from('ac_banners').update({ sort:j }).eq('id', a._id),
    sb.from('ac_banners').update({ sort:i }).eq('id', b._id),
  ]);
  [heroSlides[i], heroSlides[j]] = [b, a];
  if(heroIdx===i) heroIdx=j; else if(heroIdx===j) heroIdx=i;
  showAdminTab('banner');
}
async function bannerDelete(i){
  if(!confirm(`"${heroSlides[i].title}" 배너를 삭제할까요?`)) return;
  const { error } = await sb.from('ac_banners').delete().eq('id', heroSlides[i]._id);
  if(err(error,'삭제 실패')) return;
  heroSlides.splice(i,1);
  heroIdx = 0;
  showAdminTab('banner');
}
async function bannerAdd(){
  const v = id => document.getElementById(id).value.trim();
  if(!v('bTitle')){ alert('제목을 입력해 주세요!'); return; }
  let img_url = v('bImg') || null;
  if(!img_url && bannerPendingImg){ img_url = await uploadPhoto(bannerPendingImg); bannerPendingImg = null; }
  const row = {
    tag: v('bTag') || 'NOTICE', emoji: v('bEmoji') || '📌',
    title: v('bTitle'), sub: v('bSub'),
    grad: bannerGrads[heroSlides.length % bannerGrads.length],
    img_url, post_id: v('bPost') ? Number(v('bPost')) : null,
    board_id: (!v('bPost') && v('bBoard')) ? v('bBoard') : null,
    sort: heroSlides.length,
  };
  const { data, error } = await sb.from('ac_banners').insert(row).select().single();
  if(err(error,'배너 추가 실패')) return;
  heroSlides.push({ _id:data.id, tag:row.tag, emoji:row.emoji, title:row.title, sub:row.sub,
    grad:row.grad, img:await signedOrOriginal(img_url), postId:row.post_id, boardId:row.board_id, sort:row.sort });
  showAdminTab('banner');
}

function toggleAttAdmin(mi, wi){
  const s = members[mi];
  const val = !s.att[wi];
  s.att[wi] = val; // 낙관적 반영 (포인트는 서버 RPC가 처리)
  addPoints(s, val?'주일예배 출석':'출석 체크 취소', val?20:-20);
  if(val){
    s.lastAttendedDate = attendance[wi].ymd;
    s.lastAttended = attendance[wi].week.match(/\((.*)\)/)[1];

  sb.rpc('ac_att_set', { target:s.id, day:attendance[wi].ymd, val }).then(({error})=>{
    if(error){ alert('출석 저장 실패: '+error.message); }
  });
  showAdminTab('students');
}

function todayMD(){ const d=new Date(); return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2300);
}

function addPoints(m, label, amt){
  if(!m) return;
  m.points = (m.points||0) + amt;
  pointLog.unshift({ name:m.name, date:todayMD(), label, amt });
  if(m===ME && amt>0) showToast(`+${amt}P · ${label} 🎉`);
}

function doneToday(label){ return pointLog.some(l=>l.name===ME.name && l.label===label && l.date===todayMD()); }
async function dailyCheck(){
  const r = await earn('daily');
  if(r===-1) showToast('오늘은 이미 출석했어요!');
  renderPoints();
}
async function verseSubmit(){
  const verse = verses[new Date().getDate() % verses.length];
  const norm = s => s.replace(/\s+/g,'');
  const v = document.getElementById('vInput').value;
  if(!v.trim()){ alert('구절을 입력해 주세요!'); return; }
  if(norm(v) !== norm(verse.text)){
    alert('구절과 조금 달라요! 다시 한 번 천천히 살펴보세요 🙂');
    return;
  }
  const r = await earn('verse', v); // 서버에서도 구절 일치를 검증
  if(r===-1) showToast('오늘은 이미 완료했어요!');
  renderPoints();
}
async function redeem(i){
  const it = shopItems[i];
  if((ME.points||0) < it.cost){ alert(`포인트가 부족해요! (${it.cost-ME.points}P 더 모아야 해요)`); return; }
  if(!confirm(`${it.cost}P로 "${it.name}"을(를) 교환할까요?`)) return;
  const { data, error } = await sb.rpc('ac_redeem_item', { idx:i });
  if(err(error,'교환 실패')) return;
  if(data!=='ok'){ alert('교환 실패: '+data); return; }
  ME.points -= it.cost;
  pointLog.unshift({ name:ME.name, date:todayMD(), label:`상점 교환 — ${it.name}`, amt:-it.cost });
  redemptions.unshift({ name:ME.name, item:it.name, date:todayMD(), status:'pending' });
  showToast('교환 신청 완료! 선생님 확인 후 지급돼요');
  renderPoints();
}
async function redeemDone(i){
  const r = redemptions[i];
  if(r._id){ const { error } = await sb.from('ac_redemptions').update({ status:'done' }).eq('id', r._id); if(err(error)) return; }
  r.status = 'done';
  showAdminTab('dash');
}

  notifications.unshift({ date:todayMD(), text, staff:!!staffOnly, read:true }); // 본인 발생 알림은 읽음 처리

  document.getElementById('bellDot').classList.toggle('hidden', !visibleNotis().some(n=>!n.read));
}
function toggleNoti(){
  const p = document.getElementById('notiPanel');
  const nowHidden = p.classList.toggle('hidden');
  if(!nowHidden){
    p.innerHTML = visibleNotis().slice(0,15).map(n=>
      `<div class="noti-item"><div>${esc(n.text)}</div><div class="nd">${n.date}</div></div>`).join('')
      || '<div class="noti-item">알림이 없어요</div>';
    visibleNotis().forEach(n=>n.read=true);
    sb.rpc('ac_mark_notis_read').then(()=>{});
    renderBell();
  }
}

let pendingImg = null, bannerPendingImg = null;
function resizeImage(file, maxW, cb){
  const rd = new FileReader();
  rd.onload = e => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      const w = Math.min(maxW, img.width);
      c.width = w; c.height = Math.round(img.height * w / img.width);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', .72));
    };
    img.src = e.target.result;
  };
  rd.readAsDataURL(file);
}

async function earn(kind, payload){

  ME.points += data;
  pointLog.unshift({ name:ME.name, date:todayMD(), label:lblMap[kind], amt:data });

  return data;
}

/* ----- 사진 보안: 비공개 버킷 + 서명 URL ----- */
const PHOTO_BUCKET = 'ac-photos';
function photoPathFromUrl(u){
  if(!u) return null;
  const parts = String(u).split('/' + PHOTO_BUCKET + '/');
  return parts.length > 1 ? decodeURIComponent(parts[1].split('?')[0]) : null;
}
/* 저장은 기존처럼 공개 URL 형식 문자열로 하되, 표시할 때는 서명 URL로 교체.
   버킷이 아직 공개 상태여도 원본 URL로 폴백하므로 안전하게 동작. */
async function signedOrOriginal(url){
  const p = photoPathFromUrl(url);
  if(!p) return url;
  try{
    const { data } = await sb.storage.from(PHOTO_BUCKET).createSignedUrl(p, 60*60*12);
    return (data && data.signedUrl) || url;
  }catch(e){ return url; }
}
async function signAllPhotos(){
  const jobs = [];
  members.forEach(m=>{ const p = photoPathFromUrl(m.photo); if(p) jobs.push({ p, set:u=>m.photo=u }); });
  posts.forEach(x=>{ const p = photoPathFromUrl(x.img); if(p) jobs.push({ p, set:u=>x.img=u }); });
  heroSlides.forEach(s=>{ const p = photoPathFromUrl(s.img); if(p) jobs.push({ p, set:u=>s.img=u }); });
  if(!jobs.length) return;
  try{
    const { data } = await sb.storage.from(PHOTO_BUCKET).createSignedUrls(jobs.map(j=>j.p), 60*60*12);
    (data||[]).forEach((r,i)=>{ if(r && r.signedUrl) jobs[i].set(r.signedUrl); });
  }catch(e){ /* 서명 실패 시 기존 URL 유지 */ }
}

/* ----- 사진 업로드 (Storage) ----- */
async function uploadPhoto(dataUrl){
  try{
    const blob = await (await fetch(dataUrl)).blob();
    const path = MYID.slice(0,8)+'-'+Date.now()+'.jpg';
    const { error } = await sb.storage.from('ac-photos').upload(path, blob, { contentType:'image/jpeg' });
    if(error) return null;
    return sb.storage.from('ac-photos').getPublicUrl(path).data.publicUrl;
  }catch(e){ return null; }
}
